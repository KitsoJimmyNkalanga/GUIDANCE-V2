<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guidance</title>
<style>
  :root { --bg:#12121a; --card:#1c1c2a; --ink:#f4f1ea; --accent:#ff5d73; --gold:#ffc857; --ok:#4cd68a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { margin:0; font-size:1.4rem; }
  .xp { flex:1; max-width:240px; }
  .bar { height:12px; background:#2c2c40; border-radius:8px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .5s; }
  .xp small { color:#aaa; }
  h2 { margin:20px 0 10px; }
  .panels { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .panel { background:#fffdf5; color:#111; border:4px solid #111; border-radius:6px; padding:10px; min-height:170px;
           display:flex; flex-direction:column; justify-content:space-between; box-shadow:4px 4px 0 var(--accent); }
  .panel .art { font-size:3rem; text-align:center; }
  .panel .bubble { background:#fff; border:2px solid #111; border-radius:14px; padding:8px; font-size:.9rem; }
  .card { background:var(--card); border-radius:12px; padding:14px; }
  pre { background:#0c0c12; padding:12px; border-radius:8px; overflow-x:auto; color:#9fe8b8; }
  button.opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px; border-radius:10px;
               border:2px solid #3a3a55; background:#24243a; color:var(--ink); font-size:1rem; cursor:pointer; }
  button.opt:hover { border-color:var(--gold); }
  .good { border-color:var(--ok) !important; } .bad { border-color:var(--accent) !important; }
  #result { margin-top:10px; min-height:1.5em; }
  .soon { opacity:.7; border:2px dashed #3a3a55; }
  .meter { margin:8px 0 12px; } #meter { background:linear-gradient(90deg,#6c8cff,var(--ok)); }
  #chat { max-height:280px; overflow-y:auto; margin:10px 0; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 12px; border-radius:14px; max-width:85%; line-height:1.35; }
  .msg.pip { background:#2c2c40; align-self:flex-start; } .msg.me { background:var(--accent); color:#fff; align-self:flex-end; }
  .row { display:flex; gap:8px; } .row input { flex:1; padding:12px; border-radius:10px; border:2px solid #3a3a55; background:#24243a; color:var(--ink); font-size:1rem; }
  .row button { padding:12px 16px; border-radius:10px; border:0; background:var(--gold); color:#111; font-weight:700; cursor:pointer; }
  .row button:disabled { opacity:.5; }
  @media (max-width:480px){ .panels{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>🧭 Guidance</h1>
    <div class="xp">
      <small id="level">Level 1 · 0 XP</small>
      <div class="bar"><div id="fill"></div></div>
    </div>
  </header>

  <h2 id="title">Loading…</h2>
  <section class="panels" id="panels"></section>

  <h2>Puzzle time 🧩</h2>
  <section class="card">
    <p id="question"></p>
    <pre id="code"></pre>
    <div id="options"></div>
    <details><summary>Need a hint?</summary><p id="hint"></p></details>
    <div id="result"></div>
  </section>

  <h2>Teach the apprentice 🎓</h2>
  <section class="card">
    <small id="meterLabel">Understanding: 0/5</small>
    <div class="bar meter"><div id="meter"></div></div>
    <div id="chat"></div>
    <div class="row">
      <input id="say" maxlength="800" placeholder="Explain the lesson in your own words…">
      <button id="send">Send</button>
    </div>
  </section>
</main>

<script>
const LESSON_ID = "rust-01-ownership";
const $ = id => document.getElementById(id);
let xp = Number(localStorage.getItem("xp") || 0);
let solved = localStorage.getItem("solved:" + LESSON_ID) === "1";

function showXp() {
  const level = Math.floor(xp / 100) + 1;
  $("level").textContent = `Level ${level} · ${xp} XP`;
  $("fill").style.width = (xp % 100) + "%";
}

async function init() {
  const res = await fetch("/api/lesson/" + LESSON_ID);
  const lesson = await res.json();
  $("title").textContent = lesson.title; pipName = lesson.apprentice.name;
  $("panels").innerHTML = lesson.panels.map(p =>
    `<div class="panel"><div class="art">${p.art}</div><div class="bubble"></div></div>`).join("");
  document.querySelectorAll(".bubble").forEach((b, i) => b.textContent = lesson.panels[i].text);
  $("question").textContent = lesson.puzzle.question;
  $("code").textContent = lesson.puzzle.code;
  $("hint").textContent = lesson.puzzle.hint;
  lesson.puzzle.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = text;
    b.onclick = () => guess(i, b);
    $("options").appendChild(b);
  });
  showXp();
}

async function guess(choice, btn) {
  const res = await fetch("/api/puzzle/check", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lesson_id: LESSON_ID, choice })
  });
  const v = await res.json();
  btn.classList.add(v.correct ? "good" : "bad");
  if (v.correct && !solved) {
    solved = true; xp += v.xp;
    localStorage.setItem("xp", xp); localStorage.setItem("solved:" + LESSON_ID, "1");
    showXp();
  }
  $("result").textContent = (v.correct ? "✅ Correct! " : "❌ Not quite. Try again! ") + (v.correct ? v.explanation : "");
}

let chat = [], pipName = "Pip", taught = localStorage.getItem("taught:" + LESSON_ID) === "1";
function bubble(who, text) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  $("chat").appendChild(d); d.scrollIntoView({ block: "nearest" });
}
async function send() {
  const text = $("say").value.trim();
  if (!text) return;
  if (chat.length >= 19) { bubble("pip", "I'm sleepy! Refresh the page for a fresh round."); return; }
  $("say").value = ""; bubble("me", text);
  chat.push({ role: "user", content: text });
  $("send").disabled = true;
  try {
    const res = await fetch("/api/teach", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lesson_id: LESSON_ID, messages: chat })
    });
    if (!res.ok) throw new Error("bad response");
    const r = await res.json();
    chat.push({ role: "assistant", content: r.reply });
    bubble("pip", r.reply);
    $("meter").style.width = (100 * r.covered.length / r.total) + "%";
    $("meterLabel").textContent = `${pipName}'s understanding: ${r.covered.length}/${r.total}`;
    if (r.done && !taught) {
      taught = true; xp += 50;
      localStorage.setItem("xp", xp); localStorage.setItem("taught:" + LESSON_ID, "1");
      showXp(); bubble("pip", "🎉 I GET IT NOW! You earned +50 XP!");
    }
  } catch (e) {
    chat.pop(); bubble("pip", "Oops, I got distracted. Say that again?");
  }
  $("send").disabled = false;
}
$("send").onclick = send;
$("say").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
init().then(() => bubble('pip', `Hi, I'm ${pipName}! I know nothing about this lesson. Can you teach me?`));
</script>
</body>
  </html>
